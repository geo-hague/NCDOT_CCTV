name: Scrape Camera Credentials (weekly)

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Puppeteer
        run: npm install puppeteer
      - name: Scrape credentials
        run: node scrape-auth.js
      - name: Merge credentials into cameras.json
        run: node merge-auth.js
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: '*.png'
          if-no-files-found: ignore
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add camera-auth.json cameras.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Update camera credentials"
          git push
