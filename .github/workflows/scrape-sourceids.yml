name: Scrape Camera SourceIds

on:
  schedule:
    # Weekly, Sunday 08:00 UTC. sourceIds rarely change; this just catches
    # cameras that were added or removed. Runs on GitHub's servers, not yours.
    - cron: '0 8 * * 0'
  workflow_dispatch: {}  # manual "Run workflow" button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # the scrape clicks through every camera; give it room
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Installs Puppeteer + a bundled Chromium (same approach as the token
      # refresh workflow). No API key needed — the scraper drives the public
      # DriveNC site, it doesn't call the keyed API.
      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Scrape sourceIds
        run: node scrape-sourceids.js

      # If the scrape ever misbehaves, any screenshots it drops get saved here
      # so you can see what the headless browser saw.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: |
            *.png
          if-no-files-found: ignore

      - name: Commit updated sourceids.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sourceids.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update sourceids.json"
          git push
