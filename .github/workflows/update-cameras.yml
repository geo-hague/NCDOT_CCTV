name: Update Camera List (daily)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cameras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch camera list
        env:
          CAMERA_API_KEY: ${{ secrets.CAMERA_API_KEY }}
        run: node fetch-cameras.js
      - name: Merge credentials into cameras.json
        run: |
          if [ -f camera-auth.json ]; then
            node merge-auth.js
          else
            echo "::warning::camera-auth.json missing — run Scrape Camera Credentials first."
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cameras.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update cameras.json"
          git push
