name: Update Camera List

on:
  schedule:
    # Runs once a day at 09:00 UTC (~5am ET). Cameras rarely move,
    # so this is just to catch new/removed cameras over time.
    - cron: '0 9 * * *'
  workflow_dispatch: {}  # allows manual "Run workflow" button in GitHub UI

permissions:
  contents: write

jobs:
  update-cameras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch camera data
        env:
          CAMERA_API_KEY: ${{ secrets.CAMERA_API_KEY }}
        run: node fetch-cameras.js

      # fetch-cameras.js writes cameras.json WITHOUT sourceIds. This re-applies
      # the real scraped ATMS sourceId/systemSourceId (from the committed
      # sourceids.json) by matching on chan. Without this step, cameras.json
      # would have no sourceIds and no camera would play.
      - name: Merge scraped sourceIds
        run: |
          if [ -f sourceids.json ]; then
            node merge-sourceids.js
          else
            echo "::warning::sourceids.json not found - skipping merge. Cameras will not play until you commit sourceids.json (run scrape-sourceids.js)."
          fi

      - name: Commit updated cameras.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cameras.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update cameras.json"
          git push
