name: Update Camera List (daily)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cameras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch camera list
        env:
          CAMERA_API_KEY: ${{ secrets.CAMERA_API_KEY }}
        run: node fetch-cameras.js
      - name: Re-apply tokens
        run: |
          if [ -f tokens.json ]; then node merge-tokens.js; else echo "no tokens.json yet"; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cameras.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update cameras.json"
          git pull --rebase origin main
          git push
