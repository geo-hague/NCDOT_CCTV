name: Refresh Camera Tokens

on:
  schedule:
    # Twice a day, like your working viewer. Tokens last ~a day; this keeps them
    # fresh. Full scrape takes ~1-1.5h, so it runs on GitHub, not your machine.
    - cron: '0 8,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Puppeteer
        run: npm install puppeteer
      - name: Scrape tokens
        run: node scrape-tokens.js
      - name: Bake tokens into cameras.json
        run: node merge-tokens.js
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: '*.png'
          if-no-files-found: ignore
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cameras.json tokens.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Refresh camera tokens"
          git pull --rebase origin main
          git push
