name: Refresh Camera Tokens

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # 1) Work out how many 50-camera pages each roadway has -> emit a job matrix.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      chunks: ${{ steps.gen.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install puppeteer
      - id: gen
        run: echo "chunks=$(node gen-chunks.js)" >> "$GITHUB_OUTPUT"

  # 2) One job per 50-camera page. Each runs on its own runner/IP, so no IP
  #    ever scrapes more than 50 cameras in a row -> no throttling.
  scrape:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install puppeteer
      - name: Scrape page
        env:
          ROADWAY: ${{ matrix.chunk.roadway }}
          START: ${{ matrix.chunk.start }}
          OUT_FILE: tokens-part.json
          DEBUG_MISS: '1'
        run: node scrape-tokens.js
      - uses: actions/upload-artifact@v4
        with:
          name: tokens-${{ matrix.chunk.id }}
          path: tokens-part.json
          if-no-files-found: warn

  # 3) Combine every page, bake into cameras.json, push once.
  merge:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - run: node combine-tokens.js
      - run: node merge-tokens.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cameras.json tokens.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Refresh camera tokens"
          git pull --rebase origin main
          git push
