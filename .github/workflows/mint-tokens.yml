name: Mint Camera Tokens (frequent)

on:
  schedule:
    # Every 3 hours. This is the fast, browser-free refresh — it just POSTs for
    # fresh tokens, so it finishes in ~1-2 min. Tokens last ~a day per your
    # testing, so every 3h is comfortable headroom; adjust freely.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mint fresh tokens
        run: |
          if [ -f camera-auth.json ]; then
            node mint-tokens.js
          else
            echo "::warning::camera-auth.json missing — run the Scrape Camera Credentials workflow first."
          fi
      - name: Commit cameras.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cameras.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Refresh camera tokens"
          git pull --rebase origin main          
          git push
